<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — CineHall</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="brand"><span class="brand-mark"></span>CineHall</a>
    <ul class="nav-links"><li><a href="index.html">Movies</a></li></ul>
  </div>
</nav>

<div class="container" style="max-width:520px; padding:40px 28px 60px;" id="page"></div>

<script src="script.js"></script>
<script>
DB.ready.then(()=>{
if(requireAuth()){

const pending = JSON.parse(sessionStorage.getItem('ch_pending_booking')||'null');
const page = qs('#page');

if(!pending){
  page.innerHTML = `<div class="empty-state"><div class="h-display">Nothing to check out</div><a href="index.html" style="color:var(--gold)">Browse movies</a></div>`;
} else {
  const show = DB.getShow(pending.showId);
  const movie = DB.getMovie(show.movieId);
  const session = DB.getSession();

  page.innerHTML = `
    <p class="eyebrow" style="margin-bottom:14px;">Checkout</p>
    <div class="card" style="margin-bottom:20px;">
      <p style="font-weight:700;">${movie.title}</p>
      <p class="muted" style="font-size:.86rem; margin-top:4px;">${show.cinema} · ${fmtDate(show.date)} · ${show.time}</p>
      <p class="mono" style="margin-top:10px; color:var(--gold);">${pending.seats.join(', ')}</p>
      <p style="margin-top:10px; display:flex; justify-content:space-between; border-top:1px solid var(--border-soft); padding-top:10px;">
        <span class="muted">Total</span><span class="h-display" style="font-size:1.3rem;">₹${pending.total}</span>
      </p>
    </div>

    <form id="checkoutForm">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" required readonly value="${session?session.name:''}" placeholder="As on ID">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required readonly value="${session?session.email:''}" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" required readonly value="${session?session.phone:''}" placeholder="10-digit mobile number">
      </div>
      <button class="btn btn-gold btn-block" type="submit">Pay ₹${pending.total} & Confirm</button>
    </form>
  `;

  qs('#checkoutForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = qs('#checkoutForm button[type=submit]');
    btn.disabled = true;
    const r = await DB.addBooking(show.id, pending.seats);   // server re-prices seats & blocks double-booking
    if(!r.ok){
      toast(r.error || 'Booking failed');
      setTimeout(()=>{ location.href = 'seats.html?showId=' + show.id; }, 1800);
      return;
    }
    sessionStorage.removeItem('ch_pending_booking');
    sessionStorage.setItem('ch_last_booking', JSON.stringify(r.booking));
    location.href = 'confirmation.html';
  });
}

}

});
</script>
</body>
</html>
