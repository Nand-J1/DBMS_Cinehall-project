<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Showtimes — CineHall Admin</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="script.js"></script>
<script src="admin-shell.js"></script>
<script>
DB.ready.then(()=>{
const ui = renderAdminShell('shows');
if(ui){
  ui.setTitle('Showtimes');
  ui.topbarRight.innerHTML = `<button class="btn btn-gold btn-sm" id="addShowBtn">+ Add Showtime</button>`;

  function renderTable(){
    const shows = DB.getShows();
    ui.content.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Movie</th><th>Cinema</th><th>Date</th><th>Time</th><th>Prices (S/G/P)</th><th>Booked</th><th></th></tr></thead>
          <tbody>
            ${shows.map(s=>{
              const movie = DB.getMovie(s.movieId);
              return `<tr>
                <td style="font-weight:700;">${movie ? movie.title : '—'}</td>
                <td>${s.cinema}</td>
                <td>${fmtDate(s.date)}</td>
                <td class="mono">${s.time}</td>
                <td class="mono">₹${s.price.silver}/₹${s.price.gold}/₹${s.price.premium}</td>
                <td>${s.bookedSeats.length} seats</td>
                <td><button class="icon-btn" data-del="${s.id}" title="Delete">✕</button></td>
              </tr>`;
            }).join('') || `<tr><td colspan="7" class="muted" style="text-align:center; padding:30px;">No showtimes scheduled.</td></tr>`}
          </tbody>
        </table>
      </div>
    `;
    qsa('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
      if(!confirm('Remove this showtime?')) return;
      const r = await DB.deleteShow(b.dataset.del);
      toast(r.ok ? 'Showtime removed' : (r.error || 'Could not remove'));
      renderTable();
    }));
  }

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const movies = DB.getMovies();
  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>Add Showtime</h3><button class="icon-btn" id="closeModal">✕</button></div>
      <form id="showForm">
        <div class="field"><label for="f-movie">Movie</label>
          <select id="f-movie">${movies.map(m=>`<option value="${m.id}">${m.title}</option>`).join('')}</select>
        </div>
        <div class="field"><label for="f-cinema">Cinema</label>
          <select id="f-cinema">${DB.getTheatres().map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select>
        </div>
        <div class="field"><label for="f-date">Date</label><input id="f-date" type="date" required></div>
        <div class="field"><label for="f-time">Time</label><input id="f-time" required placeholder="e.g. 7:15 PM"></div>
        <div class="field"><label for="f-silver">Silver price</label><input id="f-silver" type="number" value="150" required></div>
        <div class="field"><label for="f-gold">Gold price</label><input id="f-gold" type="number" value="220" required></div>
        <div class="field"><label for="f-premium">Premium price</label><input id="f-premium" type="number" value="320" required></div>
        <button class="btn btn-gold btn-block" type="submit">Save Showtime</button>
      </form>
    </div>`;
  document.body.appendChild(backdrop);

  qs('#addShowBtn').addEventListener('click', ()=>backdrop.classList.add('open'));
  qs('#closeModal').addEventListener('click', ()=>backdrop.classList.remove('open'));
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) backdrop.classList.remove('open'); });

  qs('#showForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const r = await DB.addShow({
      movieId: qs('#f-movie').value,
      theatreId: qs('#f-cinema').value,
      date: qs('#f-date').value,
      time: qs('#f-time').value.trim(),
      silver: qs('#f-silver').value, gold: qs('#f-gold').value, premium: qs('#f-premium').value
    });
    if(!r.ok){ toast(r.error || 'Could not add showtime'); return; }
    backdrop.classList.remove('open');
    toast('Showtime added');
    renderTable();
  });

  renderTable();
}

});
</script>
</body>
</html>
