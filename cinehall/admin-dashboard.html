<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — CineHall</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="script.js"></script>
<script src="admin-shell.js"></script>
<script>
DB.ready.then(()=>{
const ui = renderAdminShell('dashboard');
if(ui){
  ui.setTitle('Dashboard');

  const movies = DB.getMovies();
  const shows = DB.getShows();
  const bookings = DB.getBookings();
  const live = bookings.filter(b=>b.status==='confirmed');
  const revenue = live.reduce((s,b)=>s+b.total, 0);
  const seatsSold = live.reduce((s,b)=>s+b.seats.length, 0);

  ui.content.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${movies.length}</div><div class="stat-label">Movies listed</div></div>
      <div class="stat-card"><div class="stat-num">${shows.length}</div><div class="stat-label">Active showtimes</div></div>
      <div class="stat-card"><div class="stat-num">${bookings.length}</div><div class="stat-label">Tickets booked</div></div>
      <div class="stat-card"><div class="stat-num">₹${revenue}</div><div class="stat-label">Revenue (${seatsSold} seats)</div></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Ticket</th><th>Movie</th><th>Show</th><th>Seats</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody>
          ${bookings.slice(0,8).map(b=>{
            const show = DB.getShow(b.showId), movie = DB.getMovie(b.movieId);
            if(!show||!movie) return '';
            return `<tr>
              <td class="mono">${b.code}</td>
              <td>${movie.title}</td>
              <td>${fmtDate(show.date)} · ${show.time}</td>
              <td class="mono">${b.seats.join(', ')}</td>
              <td>₹${b.total}</td>
              <td><span class="status-badge ${b.status==='cancelled'?'status-cancelled':'status-confirmed'}">${b.status}</span></td>
            </tr>`;
          }).join('') || `<tr><td colspan="6" class="muted" style="text-align:center; padding:30px;">No bookings yet</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

});
</script>
</body>
</html>
