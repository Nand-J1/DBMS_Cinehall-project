<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings — CineHall Admin</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="script.js"></script>
<script src="admin-shell.js"></script>
<script>
DB.ready.then(()=>{
const ui = renderAdminShell('bookings');
if(ui){
  ui.setTitle('Bookings');
  ui.topbarRight.innerHTML = `<input id="searchBox" placeholder="Search by name, email, or code" style="background:var(--bg-raised); border:1px solid var(--border); border-radius:8px; padding:9px 13px; color:var(--text); width:240px;">`;

  function renderTable(){
    const q = (qs('#searchBox')?.value || '').toLowerCase();
    const bookings = DB.getBookings().filter(b =>
      !q || b.name.toLowerCase().includes(q) || b.email.toLowerCase().includes(q) || b.code.toLowerCase().includes(q)
    );

    ui.content.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Code</th><th>Customer</th><th>Movie</th><th>Show</th><th>Seats</th><th>Amount</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${bookings.map(b=>{
              const show = DB.getShow(b.showId), movie = DB.getMovie(b.movieId);
              return `<tr>
                <td class="mono">${b.code}</td>
                <td>${b.name}<br><span class="muted" style="font-size:.76rem;">${b.email}</span></td>
                <td>${movie ? movie.title : '—'}</td>
                <td>${show ? `${fmtDate(show.date)} · ${show.time}` : '—'}</td>
                <td class="mono">${b.seats.join(', ')}</td>
                <td>₹${b.total}</td>
                <td><span class="status-badge ${b.status==='cancelled'?'status-cancelled':'status-confirmed'}">${b.status}</span></td>
                <td>${b.status!=='cancelled' ? `<button class="icon-btn" data-cancel="${b.id}" title="Cancel">✕</button>` : ''}</td>
              </tr>`;
            }).join('') || `<tr><td colspan="8" class="muted" style="text-align:center; padding:30px;">No bookings match.</td></tr>`}
          </tbody>
        </table>
      </div>
    `;
    qsa('[data-cancel]').forEach(b=>b.addEventListener('click', async ()=>{
      if(!confirm('Cancel this booking?')) return;
      const r = await DB.cancelBooking(b.dataset.cancel);
      toast(r.ok ? 'Booking cancelled' : (r.error || 'Could not cancel'));
      renderTable();
    }));
  }

  qs('#searchBox').addEventListener('input', renderTable);
  renderTable();
}

});
</script>
</body>
</html>
